  # GNSS AFE analog hard macro (rev.4b, 1020.9 x 1571.0 um) at north end of 0p5x1 core
  gnss_afe_analog:
    gds:
      - dir::../../layout/gds/gnss_afe_analog.gds
    lef:
      - dir::../../layout/lef/gnss_afe_analog.lef
    vh:
      - dir::../src/gnss_afe_analog.v
    spice:
      - dir::../../layout/spice/gnss_afe_analog.spice
    instances:
      i_chip_core.i_afe:
        location: [456.0, 3089.4]   # top edge 4660.4 um (19.6 um below core top, identical strap geometry to 0p5x0p5)
        orientation: FN

  # proppy/ttgf-megabytebeat hardened macro (XLS original, 960 x 960 um, dedicated VDD_BB domain)
  megabytebeat_macro:
    gds:
      - dir::../macros/megabytebeat/final/gds/megabytebeat_macro.gds
    lef:
      - dir::../macros/megabytebeat/final/lef/megabytebeat_macro.lef
