    spice:
      - dir::../macros/megabytebeat/final/spice/megabytebeat_macro.spice
    lib:
      "nom_tt_025C_5v00":
        - dir::../macros/megabytebeat/final/lib/nom_tt_025C_5v00/megabytebeat_macro__nom_tt_025C_5v00.lib
      "nom_ss_125C_4v50":
        - dir::../macros/megabytebeat/final/lib/nom_ss_125C_4v50/megabytebeat_macro__nom_ss_125C_4v50.lib
      "nom_ff_n40C_5v50":
        - dir::../macros/megabytebeat/final/lib/nom_ff_n40C_5v50/megabytebeat_macro__nom_ff_n40C_5v50.lib
      "min_tt_025C_5v00":
        - dir::../macros/megabytebeat/final/lib/min_tt_025C_5v00/megabytebeat_macro__min_tt_025C_5v00.lib
      "min_ss_125C_4v50":
